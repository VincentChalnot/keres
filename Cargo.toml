[package]
name = "keres"
version = "0.1.0"
edition = "2021"
authors = ["Vincent Chalnot"]
description = "A library for the abstract game Keres"
license = "GPL-3.0-only"
repository = "https://github.com/vincentchalnot/keres"
build = "build.rs"

[features]
# Native minifb GUI binary. Off by default so the server/CLI stay free of the
# X11/minifb dependency (keeps the Docker server build clean).
gui = ["dep:minifb", "dep:dirs-next", "dep:winres"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["catch-panic", "cors"] }
rayon = "1.10"
ahash = "0.8.12"
once_cell = "1.21.3"
mimalloc = "0.1.48"
minifb = { version = "0.28", default-features = false, features = ["x11"], optional = true }
dirs-next = { version = "2.0", optional = true }

[dev-dependencies]
# In-process HTTP testing: drive the `api::router` directly through
# `ServiceExt::oneshot` (no sockets, no ports, no flakiness) and read the
# binary response bodies back. See tests/api.rs and docs/TESTING.md.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "keres_engine"
path = "src/lib.rs"

[[bin]]
name = "keres"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "arena"
path = "src/arena.rs"

[[bin]]
name = "gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.release]
# Production profile for the server + CLI: speed first (the AI search is
# latency-critical), but keep what's free — fat LTO and a single codegen unit
# shrink the binary while improving runtime, and strip drops debug symbols.
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.gui]
# Size-minimized profile for the native GUI binary (micro-keres lineage: the
# <1.44 MB contest target). `panic = "abort"` drops the unwind tables; `z`
# trades a little AI-search speed the GUI never notices for smallest codegen.
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[target.x86_64-unknown-linux-musl.dependencies]
mimalloc = "0.1.43"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/generated/keres.ico as a Win32 PE resource (see build.rs) so
# the .exe itself carries the icon — Explorer, the taskbar, and Alt-Tab all
# pick it up with no runtime API call needed. Only pulled in for the `gui`
# feature build (build.rs itself is `#[cfg(feature = "gui")]`-gated), so the
# keres/server binaries stay unaffected.
winres = { version = "0.1", optional = true }
