# Standalone Compose file for the Keres game engine.
#
# Runs the Rust HTTP server (raw binary API, see docs/PROTOCOL.md) with no
# external dependencies. Use this to run the engine on its own, or as the
# `backend` image consumed by keres-platform (which pulls it from
# ghcr.io/vincentchalnot/keres/backend by default — point its
# BACKEND_API_URL/AI_BACKEND_API_URL at this container to use a local build
# instead).
#
# Usage:
#   docker compose up --build
#   curl http://localhost:3000/new --output board.bin

name: keres

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Hardening knobs — all optional, see docs/PROTOCOL.md § Configuration
      # and SECURITY.md. The defaults are deliberately permissive (no auth,
      # any origin) because the engine is expected to sit behind a trusted
      # caller; set these for anything a browser can reach directly.
      KERES_API_TOKEN: ${KERES_API_TOKEN:-}
      KERES_CORS_ALLOWED_ORIGINS: ${KERES_CORS_ALLOWED_ORIGINS:-*}
      KERES_MAX_HISTORY_MOVES: ${KERES_MAX_HISTORY_MOVES:-4096}
      KERES_MAX_CONCURRENT_SEARCHES: ${KERES_MAX_CONCURRENT_SEARCHES:-2}
      KERES_SEARCH_TIMEOUT_SECS: ${KERES_SEARCH_TIMEOUT_SECS:-60}
