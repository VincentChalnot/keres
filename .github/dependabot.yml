---
# Dependabot keeps the three dependency surfaces this repo actually has in
# sync: the Cargo lockfile, the pinned GitHub Actions, and the Docker base
# image used by the backend build. Needs "Dependabot alerts" and "Dependabot
# security updates" enabled in the repository settings to also open PRs for
# RUSTSEC advisories — see the deployment notes in docs/TESTING.md.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for the routine patch/minor churn; majors still come
      # in individually because they need a real review.
      rust-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
