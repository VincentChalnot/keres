name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # No build cache here on purpose: this workflow publishes the binaries
      # users download, and a restored cache is writable by any branch that
      # can run CI (zizmor's cache-poisoning audit). A release build is rare
      # enough that a few cold minutes are cheaper than that provenance gap.

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --features gui -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --features gui

  build-gui:
    name: Build GUI (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cargo_bin` is Cargo's own [[bin]] output name (fixed — see the
          # Makefile comment on GUI_CARGO_BIN); the shipped file is always
          # named `keres`/`keres.exe`, either directly (dist_name) or as the
          # macOS .app bundle's executable (scripts/package_macos_app.sh).
          - os: ubuntu-latest
            asset: keres-gui-linux-x86_64
            cargo_bin: gui
            package: binary
            dist_name: keres
          - os: windows-latest
            asset: keres-gui-windows-x86_64
            cargo_bin: gui.exe
            package: binary
            dist_name: keres.exe
          - os: macos-latest
            asset: keres-gui-macos-x86_64
            cargo_bin: gui
            package: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No build cache — see the comment in the `test` job above.

      - name: Build GUI
        run: cargo build --locked --profile gui --bin gui --features gui

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.package }}" = "app" ]; then
            scripts/package_macos_app.sh "target/gui/${{ matrix.cargo_bin }}" dist "${GITHUB_REF_NAME#v}"
          else
            cp "target/gui/${{ matrix.cargo_bin }}" "dist/${{ matrix.dist_name }}"
          fi
          cp README.md LICENSE dist/
          tar czf "${{ matrix.asset }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build-gui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum ./*.tar.gz > SHA256SUMS.txt

      # `gh` ships on the runner, so the publishing step — the one with
      # `contents: write` — runs no third-party code at all.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Keres $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
